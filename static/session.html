<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYKAMI NeuroGame Engine - Open Than Go</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

#visual-gallery {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 2s;
    background-size: cover;
    background-position: center;
}

.slide.active {
    opacity: 0.4;
}

#ui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* ================= CÍRCULO RESPIRATORIO (PULMÓN HUMANO) ================= */
#visual-circle {
    width: 190px;
    height: 190px;
    border-radius: 50% 50% 45% 45% / 60% 60% 40% 40%;
    border: 4px solid #38bdf8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    margin-bottom: 20px;
    transition: all 4s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
}

.inhale-lung {
    transform: scale(1.35) translateY(-5px);
    border-radius: 48% 48% 42% 42% / 55% 55% 45% 45%;
    background: rgba(56, 189, 248, 0.22);
    box-shadow: 0 0 45px rgba(56, 189, 248, 0.5);
}

.exhale-lung {
    transform: scale(0.75) translateY(5px);
    border-radius: 52% 52% 48% 48% / 65% 65% 35% 35%;
    background: rgba(239, 68, 68, 0.18);
    box-shadow: 0 0 20px rgba(239, 68, 68, 0.3);
}

.hold-lung {
    transform: scale(1.15);
    border-radius: 50%;
    background: rgba(245, 158, 11, 0.22);
    box-shadow: 0 0 35px rgba(245, 158, 11, 0.4);
}

#block {
    width: 90%;
    max-width: 700px;
    height: 180px;
    overflow-y: auto;
    font-size: 1.3rem;
    text-align: center;
    padding: 10px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
}

.controls {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(0,0,0,0.85);
    padding: 8px;
    z-index: 999;
    flex-wrap: wrap;
}

button {
    flex: 1;
    margin: 3px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 0.95rem;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#pay-btn {
    background: #f59e0b;
    color: #000;
    font-weight: bold;
}

#open-than-go-btn {
    background: #10b981;
    color: #fff;
    font-weight: bold;
}

#lang-btn {
    background: #8b5cf6;
    color: #fff;
    font-weight: bold;
}

@media (max-width: 768px) {
    #visual-circle {
        width: 140px;
        height: 140px;
        font-size: 1rem;
    }
    #block {
        height: 140px;
        font-size: 1rem;
    }
    button {
        font-size: 0.75rem;
        padding: 8px 4px;
    }
}
</style>
</head>
<body>

<div id="visual-gallery"></div>

<div id="ui">
    <div id="visual-circle">MAYKAMI</div>
    <div id="block" data-translate="ready_text">Listo para iniciar sesión</div>
</div>

<div class="controls">
    <button id="open-than-go-btn" onclick="irOpenThanGo()">Open Than Go</button>
    <button id="pay-btn" onclick="iniciarPago()">Stripe ($5.99)</button>
    <button id="lang-btn" onclick="toggleLanguage()">ES / EN</button>
    <button id="start-btn" data-translate="start_btn">Iniciar</button>
    <button id="back-btn" data-translate="back_btn">Atrás</button>
    <button id="next-btn" data-translate="next_btn">Siguiente</button>
    <button id="restart-btn" data-translate="restart_btn">Reiniciar</button>
</div>

<script src="/static/scripts.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYKAMI NeuroGame Engine</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

#visual-gallery {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

#ui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

#visual-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 4px solid #60a5fa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin-bottom: 20px;
}

#block {
    width: 90%;
    max-width: 700px;
    height: 180px;
    overflow-y: auto;
    font-size: 1.3rem;
    text-align: center;
    padding: 10px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
}

.controls {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(0,0,0,0.85);
    padding: 8px;
    z-index: 999;
    flex-wrap: wrap;
}

button {
    flex: 1;
    margin: 4px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#lang-btn {
    background: #8b5cf6;
    color: #fff;
    font-weight: bold;
}

#mother-app-btn {
    background: #10b981;
    color: #fff;
    font-weight: bold;
}
</style>
</head>
<body>

<div id="visual-gallery"></div>

<div id="ui">
    <div id="visual-circle">MAYKAMI</div>
    <div id="block">Acceso Autorizado Correctamente</div>
</div>

<div class="controls">
    <button id="mother-app-btn" onclick="irAppMadre()">Open Than Go</button>
    <button id="lang-btn" onclick="toggleLanguage()">Idioma: ES / EN</button>
    <button id="start-btn" onclick="iniciarApp()">Iniciar</button>
    <button id="back-btn">Atrás</button>
    <button id="next-btn">Siguiente</button>
    <button id="restart-btn" onclick="location.reload()">Reiniciar</button>
</div>

<script>
// Funciones globales aseguradas para evitar errores de referencia
function irAppMadre() {
    window.location.href = "https://openthango.com";
}

function toggleLanguage() {
    alert("Idioma cambiado / Language changed");
}

function iniciarApp() {
    document.getElementById("block").innerText = "Sistema Activo y Operando.";
}
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAYKAMI NeuroGame Engine</title>

<style>
body {
    margin: 0;
    background: #000;
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

#visual-gallery {
    position: fixed;
    width: 100%;
    height: 100%;
    z-index: -1;
}

.slide {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    transition: opacity 2s;
    background-size: cover;
    background-position: center;
}

.slide.active {
    opacity: 0.4;
}

#ui {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 80px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
}

/* ================= CÍRCULO RESPIRATORIO NATURAL ================= */
#visual-circle {
    width: 180px;
    height: 180px;
    border-radius: 50%;
    border: 4px solid #60a5fa;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.4rem;
    margin-bottom: 20px;
    transition: transform 3.5s ease-in-out, background 3.5s ease-in-out;
}

.inhale {
    transform: scale(1.35);
    background: rgba(96,165,250,0.25);
}

.exhale {
    transform: scale(0.75);
    background: rgba(239,68,68,0.25);
}

.hold {
    transform: scale(1.1);
    background: rgba(245,158,11,0.25);
}

#block {
    width: 90%;
    max-width: 700px;
    height: 180px;
    overflow-y: auto;
    font-size: 1.3rem;
    text-align: center;
    padding: 10px;
    text-shadow: 2px 2px 10px rgba(0,0,0,0.8);
}

.controls {
    position: fixed;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: rgba(0,0,0,0.85);
    padding: 8px;
    z-index: 999;
    flex-wrap: wrap;
}

button {
    flex: 1;
    margin: 4px;
    padding: 10px;
    border: none;
    border-radius: 8px;
    background: #2563eb;
    color: white;
    font-size: 0.9rem;
    cursor: pointer;
}

button:hover {
    background: #1d4ed8;
}

#lang-btn {
    background: #8b5cf6;
    color: #fff;
    font-weight: bold;
}

#mother-app-btn {
    background: #10b981;
    color: #fff;
    font-weight: bold;
}

@media (max-width: 600px) {
    #visual-circle {
        width: 140px;
        height: 140px;
        font-size: 1.1rem;
    }
    #block {
        height: 150px;
        font-size: 1.1rem;
    }
    button {
        font-size: 0.75rem;
        padding: 8px;
    }
}
</style>
</head>
<body>

<div id="visual-gallery"></div>

<div id="ui">
    <div id="visual-circle">MAYKAMI</div>
    <div id="block">Sistema Autorizado</div>
</div>

<div class="controls">
    <button id="mother-app-btn" onclick="irAppMadre()">Open Than Go</button>
    <button id="lang-btn" onclick="toggleLanguage()">Idioma: ES / EN</button>
    <button id="start-btn">Iniciar</button>
    <button id="back-btn">Atrás</button>
    <button id="next-btn">Siguiente</button>
    <button id="restart-btn">Reiniciar</button>
</div>

<script src="/static/scripts.js"></script>
</body>
</html>
function irAppMadre() {
    window.location.href = "https://openthango.com";
}
